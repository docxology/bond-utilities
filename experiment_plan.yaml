conditions:
  - name: cipher_roundtrip
    role: reference
    description: "Every cipher must satisfy decrypt(encrypt(x)) == x on real streams (Caesar, Vigenere, one-time-pad, xor)."
  - name: codename_determinism
    role: proposed
    description: "A fixed seed must reproduce the exact codename list across runs and processes."
  - name: schedule_window_boundary
    role: variant
    description: "Half-open [start, end) window semantics; closed exactly at end, durations clamp at zero."
metrics:
  primary:
    name: roundtrip_fidelity
    direction: maximize
protocol: "Run the deterministic unit suite with fixed seeds and explicit `now` values; assert round-trips, byte equality, and error branches."
expected_figures:
  - fig:schedule
expected_tables:
  - tbl:mission_parameters
baselines:
  - cipher_roundtrip
ablations:
  - schedule_window_boundary
