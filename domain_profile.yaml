domain: mission_utilities
display_name: BOND utilities — Q-Branch Foundation
required_packages:
  - numpy
  - matplotlib
  - pyyaml
  - pytest
preferred_outputs:
  - pdf
  - html
validation_gates:
  - artifact_manifest
  - evidence_grounding
  - zero_mock_audit
figure_types:
  - mission_schedule
citation_policy: official_or_scholarly
source_policy: "Prefer primary project outputs and scholarly references (Shannon, Kahn, ISO 8601)."
review_gates:
  - zero_mock_audit
  - evidence_grounding
artifact_expectations:
  - output/data/manuscript_variables.json
  - output/figures/mission_schedule.png
benchmark_rubric:
  name: bond-foundation-readiness
  dimensions:
    - name: determinism
      weight: 1.0
    - name: roundtrip_fidelity
      weight: 1.0
    - name: provenance
      weight: 1.0
